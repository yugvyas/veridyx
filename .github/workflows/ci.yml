name: ci

# `on` is quoted because YAML 1.1 treats bare `on` as the boolean true. GitHub's own
# parser handles the bare form, and the bare form did parse here — workflow_dispatch
# fired from it — but pushes to main produced no runs at all despite GitHub logging
# the PushEvents. Quoting removes the one ambiguity that is ours to remove; if pushes
# still do not trigger, the cause is upstream and not in this file.
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # LightGBM links against OpenMP at import time. It is present on ubuntu-latest
      # runners, but installing it explicitly means a runner image change cannot break
      # the build with a dlopen error that looks nothing like a dependency problem.
      - name: Install OpenMP
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # Bare `pytest`, never `python -m pytest`: the latter puts the CWD on sys.path
      # and hides import errors that only surface here.
      - name: Test
        run: pytest

      # The package is installed from git by the Hugging Face Space, so a build failure
      # breaks the deployed endpoint without breaking any test. Checked on every push.
      - name: Verify the package builds and imports
        run: |
          pip install .
          cd /tmp && python -c "import veridyx; from veridyx.schema import ScoreRequest; print(veridyx.__version__)"
