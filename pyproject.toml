[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veridyx"
version = "0.1.0"
description = "Fraudulent job posting detection, evaluated honestly and deployed against a live feed"
# 3.14 is included because the deployment target runs it. Excluding it here while
# Streamlit Community Cloud ran 3.14.7 gave the resolver an unsatisfiable constraint,
# and it backtracked to a numba from 2021 that cannot build on any modern Python —
# taking the endpoint down with an error that named numba rather than this line.
requires-python = ">=3.11,<3.15"
license = "MIT"

# Runtime only. Every entry here is imported by the serving path; anything else is a
# way for a deploy to fail. `shap` was listed and imported nowhere — the attribution
# code uses LightGBM's native TreeSHAP (see veridyx/explain.py) — and it was the sole
# reason numba and llvmlite were ever resolved.
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "scipy>=1.14,<2",
    "scikit-learn>=1.5,<2",
    "lightgbm>=4.5,<5",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
# Fetching the raw dataset; not needed to serve a trained model.
data = ["datasets>=3.2,<6"]
# Generating the report figures.
figures = ["matplotlib>=3.9,<4"]
# The DistilBERT ceiling check.
bert = ["torch>=2.5,<3", "transformers>=4.46,<6"]

# Only the package ships. Without this, setuptools sees serve/, tests/, data/ and
# reports/ as candidate top-level packages and refuses to build at all.
[tool.setuptools.packages.find]
include = ["veridyx*"]

[tool.ruff]
line-length = 92
target-version = "py311"
exclude = [".venv", "reports", "artifacts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF",
]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # argparse/pydantic idioms rely on calls in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Required so a bare `pytest` can import `veridyx`. Running `python -m pytest`
# happens to work without this because that form puts the CWD on sys.path —
# which is exactly how this class of bug stays hidden locally while failing in CI.
pythonpath = ["."]
